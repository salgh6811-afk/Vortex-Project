<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">

    <title>Vortex Community | الواجهة الرسمية</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/scrollreveal"></script>
    
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #ff00ff;
            --bg: #030303;
            --glass: rgba(255, 255, 255, 0.03);
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg);
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: white; scroll-behavior: smooth; overflow-x: hidden;
            user-select: none;
        }

        /* --- الهيدر الراقي --- */
        .navbar {
            position: fixed; top: 0; width: 100%;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(20px);
            padding: 12px 8%; display: flex; justify-content: space-between;
            align-items: center; z-index: 2000; border-bottom: 1px solid rgba(0, 210, 255, 0.1);
            box-sizing: border-box;
        }

        .nav-logo { font-size: 1.5rem; font-weight: 900; color: var(--primary); text-decoration: none; text-shadow: 0 0 10px var(--primary); }
        
        .nav-group { display: flex; align-items: center; gap: 20px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: #ccc; text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: 0.3s; }
        .nav-links a:hover { color: var(--primary); }

        /* زر دخول السيرفر العلوي الجديد */
        .nav-discord-btn {
            background: rgba(0, 210, 255, 0.1); border: 1px solid var(--primary);
            padding: 8px 18px; border-radius: 8px; color: white; text-decoration: none;
            font-size: 0.8rem; font-weight: bold; transition: 0.3s;
        }
        .nav-discord-btn:hover { background: var(--primary); color: black; box-shadow: 0 0 15px var(--primary); }

        /* --- Hero Section --- */
        .hero {
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            background: radial-gradient(circle at center, #0a0a0a 0%, #000 100%);
        }
