<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer"> <title>Vortex Community | الموقع الرسمي المؤمن</title>
    <style>
        body, html {
            margin: 0; padding: 0; min-height: 100vh;
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white; display: flex; flex-direction: column;
            user-select: none; /* منع نسخ المحتوى للحماية */
        }

        .navbar {
            width: 100%; padding: 20px 50px; display: flex;
            justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.9); border-bottom: 2px solid #00d2ff;
            box-sizing: border-box; position: fixed; top: 0; z-index: 1000;
        }

        .nav-logo { font-size: 1.8rem; font-weight: 900; color: #00d2ff; text-decoration: none; text-shadow: 0 0 10px #00d2ff; }
        
        .main-content {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding-top: 120px; text-align: center;
        }

        .vortex-title {
            font-size: clamp(3.5rem, 12vw, 7rem); margin: 0;
            text-shadow: 0 0 30px #00d2ff; font-weight: 900;
            background: linear-gradient(to bottom, #fff, #00d2ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .btn-group {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 20px; width: 90%; max-width: 600px; margin-top: 40px;
        }

        .main-btn {
            padding: 18px; border: 2px solid #00d2ff;
            color: white; text-decoration: none; border-radius: 15px;
            font-weight: 800; background: rgba(0, 210, 255, 0.05);
            transition: 0.4s; display: flex; align-items: center; justify-content: center;
            text-transform: uppercase;
        }

        .main-btn:hover { background: #00d2ff; color: black; box-shadow: 0 0 30px #00d2ff; transform: scale(1.05); }

        .apply-btn { border-color: #ff00ff; }
        .apply-btn:hover { background: #ff00ff; box-shadow: 0 0 30px #ff00ff; }

        .secure-badge { margin-top: 30px; color: #00ff00; font-size: 0.9rem; font-weight: bold; }
    </style>
</head>
<body oncontextmenu="return false;"> <nav class="navbar">
        <a href="#" class="nav-logo">VORTEX</a>
        <div style="font-weight: bold;">SITE SECURED 🔒</div>
    </nav>

    <div class="main-content">
        <h1 class="vortex-title">VORTEX</h1>
        <p style="color: #888; font-size: 1.2rem;">نظام إداري متطور ومحمي بالكامل</p>
        
        <div class="btn-group">
            <a href="https://discord.gg/ydptj63w4Q" target="_blank" rel="noopener noreferrer" class="main-btn" style="grid-column: span 2;">دخول السيرفر 🚀</a>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSfcn7F5WYw_lUJzmpqXwV-Q1BbPvX6fccFW8sb7QS9WwSU1sQ/viewform?usp=dialog" target="_blank" rel="noopener noreferrer" class="main-btn apply-btn">إدارة عليا ⭐</a>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLScHlhU2t0GitwGiVvfR6Vh39C7Jev1vitUb9UESe3jchbvIqw/viewform?usp=dialog" target="_blank" rel="noopener noreferrer" class="main-btn apply-btn">إدارة عادية 🛡️</a>
        </div>

        <div class="secure-badge">✅ اتصال مشفر وآمن 256-bit SSL</div>
    </div>

</body>
</html>
