<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Community | المجتمع الأقوى</title>
    <style>
        :root { --primary: #00d2ff; --secondary: #ff00ff; --bg: #050505; }
        body, html { margin: 0; padding: 0; background-color: var(--bg); font-family: 'Segoe UI', sans-serif; color: white; overflow-x: hidden; }
        
        /* واجهتك المفضلة */
        .hero { 
            height: 100vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            background: radial-gradient(circle, #001f3f 0%, #050505 100%); 
        }

        /* حل مشكلة الصورة المعطلة */
        .logo-box {
            width: 200px; height: 200px; margin-bottom: 20px;
            background: url('https://i.postimg.cc/mD4m3vX4/V-Logo.png') no-repeat center;
            background-size: contain;
            filter: drop-shadow(0 0 15px var(--primary));
        }

        .hero-title { 
            font-size: 8rem; font-weight: 900; letter-spacing: 10px; 
            text-shadow: 0 0 30px var(--primary); margin: 0; 
        }

        .hero-tagline { font-size: 1.5rem; color: #aaa; margin-top: 10px; }

        .main-btn { 
            margin-top: 30px; padding: 15px 50px; border: 2px solid var(--primary); 
            background: transparent; color: white; border-radius: 50px; 
            font-weight: bold; cursor: pointer; transition: 0.4s; text-decoration: none;
        }
        .main-btn:hover { background: var(--primary); color: black; box-shadow: 0 0 30px var(--primary); }

        .nav-btn {
            position: absolute; top: 20px; left: 20px;
            background: #000; border: 1px solid var(--primary);
            padding: 8px 15px; border-radius: 20px; color: white; text-decoration: none;
        }
    </style>
</head>
<body>

    <a href="https://discord.gg/ydptj63w4Q" class="nav-btn">🚀 انضم لنا</a>

    <section class="hero">
        <div class="logo-box"></div>
        
        <h1 class="hero-title">VORTEX</h1>
        <p class="hero-tagline">أكثر من مجرد سيرفر.. نحن عائلة</p>
        
        <a href="#apply" class="main-btn">ابدأ رحلتك معنا</a>
    </section>

</body>
</html>
