<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Community | المجتمع الأقوى</title>
    <script src="https://unpkg.com/scrollreveal"></script>
    <style>
        :root { --primary: #00d2ff; --secondary: #ff00ff; --bg: #050505; }
        body, html { margin: 0; padding: 0; background-color: var(--bg); font-family: 'Segoe UI', sans-serif; color: white; scroll-behavior: smooth; overflow-x: hidden; user-select: none; }
        
        .navbar { position: fixed; top: 0; width: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px); padding: 20px 8%; display: flex; justify-content: space-between; align-items: center; z-index: 2000; border-bottom: 1px solid rgba(0, 210, 255, 0.2); box-sizing: border-box; }
        .nav-logo { font-size: 1.8rem; font-weight: 900; color: var(--primary); text-decoration: none; text-shadow: 0 0 15px var(--primary); }

        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; background: #000; }
        .hero::before { 
            content: ''; position: absolute; width: 150vmax; height: 150vmax; 
            background: conic-gradient(from 0deg, transparent, var(--primary), transparent, var(--secondary), transparent); 
            animation: rotateBg 8s linear infinite; opacity: 0.15; filter: blur(60px);
        }
        @keyframes rotateBg { 100% { transform: rotate(360deg); } }

        .hero-title { font-size: clamp(4rem, 15vw, 9rem); font-weight: 900; text-transform: uppercase; letter-spacing: 10px; z-index: 10; text-shadow: 0 0 30px var(--primary); margin: 0; }
        .hero-tagline { font-size: 1.4rem; color: #aaa; margin-bottom: 35px; z-index: 10; }

        .main-btn { padding: 18px 45px; border-radius: 50px; text-decoration: none; font-weight: bold; transition: 0.4s; cursor: pointer; border: 2px solid var(--primary); color: white; background: transparent; z-index: 10; display: inline-block; }
        .main-btn:hover { background: var(--primary); color: black; box-shadow: 0 0 40px var(--primary); transform: scale(1.05); }

        .features { padding: 100px 8%; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; position: relative; z-index: 10; background: var(--bg); }
        .feat-card { background: rgba(255, 255, 255, 0.02); padding: 40px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.05); text-align: center; }

        .apply-section { padding: 100px 8%; background: #080808; text-align: center; z-index: 10; }
        .special-btn { border-color: var(--secondary); margin: 10px; }

        /* تعديل الـ Modal لضمان الظهور فوق كل شيء */
        .modal { display: none; position: fixed; z-index: 5000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .modal-content { background: #0a0a0a; padding: 35px; border-radius: 25px; border: 2px solid var(--primary); width: 95%; max-width: 500px; position: relative; }
        input, textarea { width: 100%; padding: 14px; margin: 12px 0; background: #151515; border: 1px solid #333; border-radius: 10px; color: white; box-sizing: border-box; font-size: 1rem; }
        .submit-btn { width: 100%; padding: 16px; background: var(--primary); color: black; border: none; border-radius: 10px; font-weight: 900; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { opacity: 0.8; transform: translateY(-2px); }
    </style>
</head>
<body oncontextmenu="return false;">

    <nav class="navbar">
        <a href="#" class="nav-logo">VORTEX</a>
        <a href="https://discord.gg/ydptj63w4Q" target="_blank" style="color:white; text-decoration:none; font-weight:900; border:1px solid var(--primary); padding: 5px 15px; border-radius: 20px;">انضم لنا 🚀</a>
    </nav>

    <section class="hero">
        <h1 class="hero-title">VORTEX</h1>
        <p class="hero-tagline">أكثر من مجرد سيرفر.. نحن عائلة</p>
        <a href="#apply" class="main-btn">ابدأ رحلتك معنا</a>
    </section>

    <section class="features">
        <div class="feat-card"><h3>🎮 فعاليات يومية</h3><p>بطولات وتحديات مستمرة لكل الأعضاء.</p></div>
        <div class="feat-card"><h3>🛡️ بيئة آمنة</h3><p>نظام حماية متطور وفريق إشراف محترف.</p></div>
        <div class="feat-card"><h3>🤝 مجتمع متفاعل</h3><p>مكان يجمع المبدعين في أجواء محترمة.</p></div>
    </section>

    <section id="apply" class="apply-section">
        <h2 style="font-size: 3rem; margin-bottom: 30px;">انضم لفريق الإدارة</h2>
        <button onclick="showModal('إدارة عليا ⭐')" class="main-btn special-btn">تقديم إدارة عليا ⭐</button>
        <button onclick="showModal('إدارة صغرى 🛡️')" class="main-btn">تقديم إدارة صغرى 🛡️</button>
    </section>

    <div id="applyModal" class="modal">
        <div class="modal-content">
            <span onclick="closeModal()" style="position:absolute; top:15px; left:20px; cursor:pointer; color:var(--primary); font-size:35px;">&times;</span>
            <h2 id="modalTitle" style="text-align:center; color:var(--primary);">تقديم</h2>
            <form id="webhookForm">
                <input type="hidden" id="rankType">
                <input type="text" id="name" placeholder="اسمك الكامل" required>
                <input type="text" id="discord" placeholder="يوزرك في الديسكورد" required>
                <input type="number" id="age" placeholder="العمر" required>
                <textarea id="exp" rows="4" placeholder="خبراتك السابقة..." required></textarea>
                <button type="submit" id="sendBtn" class="submit-btn">إرسال الطلب للفضاء ✅</button>
            </form>
        </div>
    </div>

    <script>
        // تفعيل المؤثرات
        ScrollReveal().reveal('.feat-card', { delay: 200, origin: 'bottom', distance: '50px', interval: 150 });
        
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1464910592090439681/uwfftinYjhYfh8Tq1kVwpw8Y0yZLHbus0dn3pBwHjvheD3NK0KqLJnBqSatD35pk5fTb";

        function showModal(rank) {
            document.getElementById('applyModal').style.display = 'flex';
            document.getElementById('modalTitle').innerText = "تقديم: " + rank;
            document.getElementById('rankType').value = rank;
            document.body.style.overflow = 'hidden'; // منع السكرول عند فتح النافذة
        }

        function closeModal() { 
            document.getElementById('applyModal').style.display = 'none'; 
            document.body.style.overflow = 'auto';
        }

        document.getElementById('webhookForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('sendBtn');
            btn.innerText = "جاري الإرسال...";
            btn.disabled = true;

            const vortexLogo = "https://i.postimg.cc/mD4m3vX4/V-Logo.png";

            const data = {
                username: "VORTEX BOT 🛡️",
                avatar_url: vortexLogo,
                content: "@here 📢 **طلب جديد وصل!**",
                embeds: [{
                    title: "🚀 نظام التوظيف | VORTEX",
                    color: 0x00d2ff,
                    thumbnail: { url: vortexLogo },
                    fields: [
                        { name: "📋 الرتبة", value: `> ${document.getElementById('rankType').value}` },
                        { name: "👤 المتقدم", value: `\`${document.getElementById('name').value}\``, inline: true },
                        { name: "🎂 العمر", value: `\`${document.getElementById('age').value}\``, inline: true },
                        { name: "🎮 الديسكورد", value: `**${document.getElementById('discord').value}**` },
                        { name: "📑 الخبرات", value: `\`\`\`${document.getElementById('exp').value}\`\`\`` }
                    ],
                    timestamp: new Date()
                }]
            };

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    alert("تم الإرسال بنجاح! شيك على الديسكورد 😉");
                    closeModal();
                    document.getElementById('webhookForm').reset();
                } else {
                    alert("حدث خطأ في الخادم، حاول مرة أخرى.");
                }
            } catch (err) {
                alert("تعذر الاتصال بالديسكورد، تأكد من الإنترنت.");
            } finally {
                btn.innerText = "إرسال الطلب للفضاء ✅";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
