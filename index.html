<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Community | المجتمع الأقوى</title>
    <script src="https://unpkg.com/scrollreveal"></script>
    <style>
        :root { --primary: #00d2ff; --secondary: #ff00ff; --bg: #050505; }
        body, html { margin: 0; padding: 0; background-color: var(--bg); font-family: 'Segoe UI', sans-serif; color: white; scroll-behavior: smooth; overflow-x: hidden; user-select: none; }
        
        .navbar { position: fixed; top: 0; width: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px); padding: 20px 8%; display: flex; justify-content: space-between; align-items: center; z-index: 2000; border-bottom: 1px solid rgba(0, 210, 255, 0.2); box-sizing: border-box; }
        .nav-logo { font-size: 1.8rem; font-weight: 900; color: var(--primary); text-decoration: none; text-shadow: 0 0 15px var(--primary); }

        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle at center, #111 0%, #000 100%); position: relative; overflow: hidden; }
        .hero::before { content: ''; position: absolute; width: 200%; height: 200%; background: conic-gradient(from 0deg, transparent, var(--primary), transparent); animation: rotate 10s linear infinite; opacity: 0.05; }
        @keyframes rotate { 100% { transform: rotate(360deg); } }

        .hero-title { font-size: clamp(3.5rem, 12vw, 7rem); margin-bottom: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 5px; position: relative; }
        .hero-tagline { font-size: 1.3rem; color: #aaa; margin-bottom: 30px; position: relative; }

        .main-btn { padding: 16px 40px; border-radius: 50px; text-decoration: none; font-weight: bold; transition: 0.3s; cursor: pointer; border: 2px solid var(--primary); color: white; background: transparent; display: inline-block; position: relative; }
        .main-btn:hover { background: var(--primary); color: black; box-shadow: 0 0 30px var(--primary); }

        /* المربعات الثلاثة اللي كانت مفقودة */
        .features { padding: 100px 8%; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .feat-card { background: rgba(255, 255, 255, 0.03); padding: 40px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; transition: 0.3s; }
        .feat-card:hover { border-color: var(--primary); transform: translateY(-10px); }

        .apply-section { padding: 100px 8%; background: #080808; text-align: center; }
        .btn-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 40px; }
        .special-btn { border-color: var(--secondary); }
        .special-btn:hover { background: var(--secondary); box-shadow: 0 0 30px var(--secondary); }

        /* Popup التقديم مع زر إرسال واضح */
        .modal { display: none; position: fixed; z-index: 4000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; }
        .modal-content { background: #0a0a0a; padding: 35px; border-radius: 25px; border: 2px solid var(--primary); width: 90%; max-width: 480px; position: relative; }
        input, textarea { width: 100%; padding: 14px; margin: 12px 0; background: #151515; border: 1px solid #333; border-radius: 10px; color: white; box-sizing: border-box; font-size: 1rem; }
        .submit-btn { width: 100%; padding: 15px; background: var(--primary); color: black; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1.1rem; margin-top: 10px; }
    </style>
</head>
<body oncontextmenu="return false;">

    <nav class="navbar">
        <a href="#" class="nav-logo">VORTEX</a>
        <a href="https://discord.gg/ydptj63w4Q" target="_blank" style="color:white; text-decoration:none; font-weight:bold;">انضم لنا 🚀</a>
    </nav>

    <section class="hero">
        <h1 class="hero-title">VORTEX</h1>
        <p class="hero-tagline">أكثر من مجرد سيرفر.. نحن عائلة</p>
        <a href="#apply" class="main-btn">ابدأ رحلتك معنا</a>
    </section>

    <section class="features">
        <div class="feat-card"><h3>🎮 فعاليات يومية</h3><p>بطولات، تحديات، وجوائز مستمرة لكل الأعضاء.</p></div>
        <div class="feat-card"><h3>🛡️ بيئة آمنة</h3><p>نظام حماية متطور وفريق إشراف يعمل على مدار الساعة.</p></div>
        <div class="feat-card"><h3>🤝 مجتمع متفاعل</h3><p>مكان يجمع المبدعين في أجواء يسودها الاحترام.</p></div>
    </section>

    <section id="apply" class="apply-section">
        <h2 style="font-size: 2.8rem; margin-bottom: 10px;">انضم لفريق الإدارة</h2>
        <div class="btn-container">
            <button onclick="showModal('إدارة عليا ⭐')" class="main-btn special-btn">تقديم إدارة عليا ⭐</button>
            <button onclick="showModal('إدارة صغرى 🛡️')" class="main-btn">تقديم إدارة صغرى 🛡️</button>
        </div>
    </section>

    <div id="applyModal" class="modal">
        <div class="modal-content">
            <span onclick="closeModal()" style="position:absolute; top:15px; left:20px; cursor:pointer; color:var(--primary); font-size:30px;">&times;</span>
            <h2 id="modalTitle" style="text-align:center; color:var(--primary); margin-bottom:20px;">تقديم</h2>
            <form id="webhookForm">
                <input type="hidden" id="rankType">
                <input type="text" id="name" placeholder="اسمك الكامل" required>
                <input type="text" id="discord" placeholder="يوزرك في الديسكورد" required>
                <input type="number" id="age" placeholder="العمر" required>
                <textarea id="exp" rows="4" placeholder="خبراتك السابقة..." required></textarea>
                <button type="submit" class="submit-btn">إرسال الطلب للديسكورد ✅</button>
            </form>
        </div>
    </div>

    <script>
        ScrollReveal().reveal('.feat-card', { delay: 200, origin: 'bottom', distance: '50px', interval: 150 });
        
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1464910592090439681/uwfftinYjhYfh8Tq1kVwpw8Y0yZLHbus0dn3pBwHjvheD3NK0KqLJnBqSatD35pk5fTb";

        function showModal(rank) {
            document.getElementById('applyModal').style.display = 'flex';
            document.getElementById('modalTitle').innerText = "تقديم: " + rank;
            document.getElementById('rankType').value = rank;
        }

        function closeModal() { document.getElementById('applyModal').style.display = 'none'; }

        document.getElementById('webhookForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = "جاري الإرسال...";
            const data = {
                embeds: [{
                    title: "📩 طلب جديد: " + document.getElementById('rankType').value,
                    color: 3447003,
                    fields: [
                        { name: "الاسم", value: document.getElementById('name').value },
                        { name: "العمر", value: document.getElementById('age').value },
                        { name: "الديسكورد", value: document.getElementById('discord').value },
                        { name: "الخبرات", value: document.getElementById('exp').value }
                    ]
                }]
            };
            await fetch(WEBHOOK_URL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            alert("تم الإرسال بنجاح!");
            closeModal();
            btn.innerText = "إرسال الطلب للديسكورد ✅";
        };

        setInterval(function() {
            var start = new Date(); debugger; var end = new Date();
            if (end - start > 100) { window.location.reload(); }
        }, 100);
    </script>
</body>
</html>
