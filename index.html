<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>Vortex Community | الواجهة الرسمية</title>

    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #ff00ff;
            --bg: #050505;
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg);
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: white; scroll-behavior: smooth; overflow-x: hidden;
            user-select: none; /* حماية من النسخ */
        }

        /* --- Navbar --- */
        .navbar {
            position: fixed; top: 0; width: 100%;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(15px);
            padding: 15px 8%; display: flex; justify-content: space-between;
            align-items: center; z-index: 2000; border-bottom: 1px solid rgba(0, 210, 255, 0.2);
            box-sizing: border-box;
        }

        .nav-logo { font-size: 1.8rem; font-weight: 900; color: var(--primary); text-decoration: none; text-shadow: 0 0 15px var(--primary); }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-weight: 500; font-size: 0.9rem; }

        /* --- Hero --- */
        .hero {
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        .vortex-logo-main {
            font-size: clamp(4rem, 15vw, 8rem); font-weight: 900;
            color: #fff; text-shadow: 0 0 30px var(--primary);
            margin-bottom: 5px;
        }

        /* الزر الذي طلبته في المنتصف */
        .center-btn {
            margin-top: 25px;
            padding: 15px 40px; border-radius: 50px; border: 2px solid var(--primary);
            color: white; text-decoration: none; font-weight: bold; transition: 0.3s;
            background: transparent; cursor: pointer;
        }
        .center-btn:hover { background: var(--primary); color: black; box-shadow: 0 0 30px var(--primary); }

        /* --- قسم البطاقات --- */
        .features { padding: 80px 8%; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        
        .feat-card {
            background: rgba(255, 255, 255, 0.03); padding: 50px 30px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05); text-align: center; transition: 0.4s;
        }
        .feat-card:hover { transform: translateY(-10px); border-color: var(--primary); background: rgba(0, 210, 255, 0.05); }
        .feat-card h3 { font-size: 1.6rem; margin-bottom: 15px; }
