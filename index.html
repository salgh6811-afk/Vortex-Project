    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #ff00ff;
            --bg: #050505;
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg);
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: white; scroll-behavior: smooth; overflow-x: hidden;
            user-select: none; /* حماية: منع تحديد أو نسخ النصوص */
        }

        /* --- الهيدر الاحترافي --- */
        .navbar {
            position: fixed; top: 0; width: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px);
            padding: 20px 8%; display: flex; justify-content: space-between;
            align-items: center; z-index: 2000; border-bottom: 1px solid rgba(0, 210, 255, 0.2);
            box-sizing: border-box;
        }

        .nav-logo { font-size: 1.8rem; font-weight: 900; color: var(--primary); text-decoration: none; text-shadow: 0 0 15px var(--primary); }
        .nav-links a { color: white; text-decoration: none; margin-left: 25px; font-weight: 500; transition: 0.3s; font-size: 0.9rem; }
        .nav-links a:hover { color: var(--secondary); }

        /* --- القسم الرئيسي (Hero) --- */
        .hero {
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            position: relative; overflow: hidden;
        }

        /* حركة الفورتكس في الخلفية */
        .hero::before {
            content: ''; position: absolute; width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, var(--primary), transparent);
            animation: rotate 10s linear infinite; opacity: 0.05;
        }

        @keyframes rotate { 100% { transform: rotate(360deg); } }

        .hero-content { position: relative; z-index: 10; text-align: center; }
        .hero-title { font-size: clamp(3rem, 10vw, 6rem); margin-bottom: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 5px; }
        .hero-tagline { font-size: 1.2rem; color: #aaa; margin-bottom: 30px; }

        /* --- قسم المميزات --- */
        .features { padding: 100px 8%; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .feat-card {
            background: rgba(255, 255, 255, 0.03); padding: 40px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.4s; text-align: center;
        }
        .feat-card:hover { transform: translateY(-10px); border-color: var(--primary); background: rgba(0, 210, 255, 0.05); }
        .feat-card h3 { margin-bottom: 15px; font-size: 1.5rem; color: var(--primary); }
        .feat-card p { color: #ccc; line-height: 1.6; }

        /* --- قسم التقديمات --- */
        .apply-section { padding: 100px 8%; background: #080808; text-align: center; border-top: 1px solid #111; }
        .btn-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 40px; }

        .main-btn {
            padding: 15px 35px; border-radius: 50px; text-decoration: none; font-weight: bold;
            transition: 0.3s; cursor: pointer; border: 2px solid var(--primary); color: white; background: transparent;
            display: flex; align-items: center; gap: 10px;
        }
        .main-btn:hover { background: var(--primary); color: black; box-shadow: 0 0 30px var(--primary); transform: translateY(-3px); }

        .special-btn { border-color: var(--secondary); }
        .special-btn:hover { background: var(--secondary); box-shadow: 0 0 30px var(--secondary); }
