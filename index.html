<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Community | الملاذ الآمن للأساطير</title>

    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #ff00ff;
            --dark: #050505;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--dark);
            font-family: 'Cairo', sans-serif;
            color: white; scroll-behavior: smooth; overflow-x: hidden;
        }

        /* --- شريط علوي شفاف وذكي --- */
        .navbar {
            position: fixed; top: 0; width: 100%;
            padding: 20px 8%; display: flex; justify-content: space-between;
            align-items: center; z-index: 2000;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(0, 210, 255, 0.1);
        }

        .nav-logo { font-size: 2rem; font-weight: 900; color: var(--primary); text-decoration: none; text-shadow: 0 0 20px var(--primary); }
        .nav-links a { color: white; text-decoration: none; margin-left: 30px; transition: 0.3s; font-weight: 600; }
        .nav-links a:hover { color: var(--secondary); text-shadow: 0 0 10px var(--secondary); }

        /* --- واجهة البداية (Hero) مع خلفية متحركة --- */
        .hero {
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            position: relative; overflow: hidden;
        }

        #bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; opacity: 0.3; z-index: -1;
        }

        .hero-content { z-index: 10; text-align: center; }
        .hero-title { font-size: clamp(4rem, 15vw, 8rem); font-weight: 900; background: linear-gradient(45deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 30px rgba(0, 210, 255, 0.5)); }
        .hero-tagline { font-size: 1.5rem; margin-top: 20px; color: #ccc; letter-spacing: 2px; }

        /* --- قسم الإحصائيات (Stats) --- */
        .stats-container {
            display: flex; justify-content: center; gap: 50px; margin-top: 50px;
        }
        .stat-item h2 { font-size: 2.5rem; color: var(--primary); }
        .stat-item p { color: #888; }
