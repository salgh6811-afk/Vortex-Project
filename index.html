<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Community | نظام التقديمات الجديد</title>
    <script src="https://unpkg.com/scrollreveal"></script>
    <style>
        :root { --primary: #00d2ff; --secondary: #ff00ff; --bg: #050505; }
        body, html { margin: 0; padding: 0; background-color: var(--bg); font-family: 'Segoe UI', sans-serif; color: white; scroll-behavior: smooth; overflow-x: hidden; user-select: none; }
        
        /* الهيدر */
        .navbar { position: fixed; top: 0; width: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px); padding: 20px 8%; display: flex; justify-content: space-between; align-items: center; z-index: 2000; border-bottom: 1px solid rgba(0, 210, 255, 0.2); box-sizing: border-box; }
        .nav-logo { font-size: 1.8rem; font-weight: 900; color: var(--primary); text-decoration: none; text-shadow: 0 0 15px var(--primary); }

        /* القسم الرئيسي */
        .hero { height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: radial-gradient(circle at center, #111 0%, #000 100%); }
        .hero-title { font-size: clamp(3rem, 10vw, 6rem); font-weight: 900; text-transform: uppercase; letter-spacing: 5px; margin: 0; }

        /* قسم التقديمات الجديد */
        .apply-section { padding: 80px 8%; text-align: center; }
        .apply-container { background: #0a0a0a; padding: 40px; border-radius: 20px; border: 1px solid #1a1a1a; max-width: 600px; margin: 0 auto; display: none; }
        
        .btn-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        .main-btn { padding: 15px 35px; border-radius: 50px; text-decoration: none; font-weight: bold; transition: 0.3s; cursor: pointer; border: 2px solid var(--primary); color: white; background: transparent; }
        .main-btn:hover { background: var(--primary); color: black; box-shadow: 0 0 30px var(--primary); }
        .special-btn { border-color: var(--secondary); }
        .special-btn:hover { background: var(--secondary); box-shadow: 0 0 30px var(--secondary); }

        /* الخانات */
        .input-group { text-align: right; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #888; }
        input, textarea { width: 100%; padding: 12px; background: #111; border: 1px solid #222; border-radius: 8px; color: white; box-sizing: border-box; }
    </style>
</head>
<body oncontextmenu="return false;">

    <nav class="navbar">
        <a href="#" class="nav-logo">VORTEX</a>
        <a href="https://discord.gg/ydptj63w4Q" target="_blank" class="main-btn" style="padding: 8px 20px; font-size: 0.8rem;">سيرفر الديسكورد 🚀</a>
    </nav>

    <section class="hero">
        <h1 class="hero-title">VORTEX</h1>
        <p style="color:#aaa;">اختر الرتبة التي تناسب خبراتك</p>
        <div class="btn-group">
            <button onclick="openApply('إدارة عليا ⭐')" class="main-btn special-btn">تقديم إدارة عليا ⭐</button>
            <button onclick="openApply('إدارة صغرى 🛡️')" class="main-btn">تقديم إدارة صغرى 🛡️</button>
        </div>
    </section>

    <section id="apply-form-section" class="apply-section" style="display:none;">
        <div class="apply-container">
            <h2 id="form-title" style="color:var(--primary);">طلب انضمام</h2>
            <form id="vortexForm">
                <input type="hidden" id="rank">
                <div class="input-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="name" required>
                </div>
                <div class="input-group">
                    <label>يوزرك في الديسكورد</label>
                    <input type="text" id="discord_user" placeholder="example#0000" required>
                </div>
                <div class="input-group">
                    <label>العمر</label>
                    <input type="number" id="age" required>
                </div>
                <div class="input-group">
                    <label>لماذا تريد الانضمام وما هي خبراتك؟</label>
                    <textarea id="experience" rows="4" required></textarea>
                </div>
                <button type="submit" class="main-btn" style="width:100%;">إرسال الطلب للديسكورد 📩</button>
            </form>
        </div>
    </section>

    <script>
        // --- ضع رابط الـ Webhook الخاص بك هنا ---
        const WEBHOOK_URL = "ضع_رابط_الويب_هوك_هنا"; 

        function openApply(rank) {
            document.getElementById('apply-form-section').style.display = 'block';
            document.querySelector('.apply-container').style.display = 'block';
            document.getElementById('form-title').innerText = "طلب انضمام: " + rank;
            document.getElementById('rank').value = rank;
            window.location.hash = "apply-form-section";
        }

        document.getElementById('vortexForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = "جاري الإرسال...";
            
            const data = {
                embeds: [{
                    title: "📨 طلب تقديم جديد!",
                    color: 3447003,
                    fields: [
                        { name: "الرتبة المطلوبة", value: document.getElementById('rank').value },
                        { name: "الاسم", value: document.getElementById('name').value, inline: true },
                        { name: "العمر", value: document.getElementById('age').value, inline: true },
                        { name: "الديسكورد", value: document.getElementById('discord_user').value },
                        { name: "الخبرات", value: document.getElementById('experience').value }
                    ],
                    footer: { text: "Vortex Recruitment System" }
                }]
            };

            await fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            alert("تم إرسال طلبك بنجاح!");
            location.reload();
        };

        // حماية التشويش لمنع الفحص
        setInterval(function() {
            var start = new Date(); debugger; var end = new Date();
            if (end - start > 100) { window.location.reload(); }
        }, 100);
    </script>
</body>
</html>
