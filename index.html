<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Community | الموقع الرسمي</title>
    <script src="https://unpkg.com/scrollreveal"></script>
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #ff00ff;
            --bg: #000000;
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg);
            font-family: 'Segoe UI', sans-serif;
            color: white; scroll-behavior: smooth;
        }

        /* شريط علوي بسيط ومضمون */
        .navbar {
            position: fixed; top: 0; width: 100%;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px 5%; display: flex; justify-content: space-between;
            align-items: center; z-index: 1000; border-bottom: 1px solid var(--primary);
            box-sizing: border-box;
        }

        .nav-logo { font-size: 1.5rem; font-weight: bold; color: var(--primary); text-decoration: none; }

        /* واجهة البداية */
        .hero {
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: radial-gradient(circle, #111 0%, #000 100%);
            text-align: center;
        }

        .hero-title { 
            font-size: clamp(3rem, 10vw, 6rem); 
            margin: 0; color: white;
            text-shadow: 0 0 20px var(--primary);
        }

        /* حاوية الأزرار */
        .btn-group {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 15px; margin-top: 30px; width: 90%; max-width: 500px;
        }

        .main-btn {
            padding: 15px; border: 2px solid var(--primary);
            color: white; text-decoration: none; border-radius: 12px;
            font-weight: bold; transition: 0.3s; background: rgba(0, 210, 255, 0.1);
            display: flex; align-items: center; justify-content: center;
        }

        .main-btn:hover { background: var(--primary); color: black; box-shadow: 0 0 20px var(--primary); }

        .apply-btn { border-color: var(--secondary); background: rgba(255, 0, 255, 0.1); }
        .apply-btn:hover { background: var(--secondary); box-shadow: 0 0 20px var(--secondary); }

        /* قسم المميزات */
        .features { padding: 80px 5%; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: #111; padding: 30px; border-radius: 15px; border: 1px solid #222; text-align: center; }
    </style>
</head>
<body>

        </div>
    </nav>
