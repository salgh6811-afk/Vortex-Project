<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Community | المجتمع الأقوى</title>
    <script src="https://unpkg.com/scrollreveal"></script>
    <style>
        :root { --primary: #00d2ff; --secondary: #ff00ff; --bg: #050505; }
        body, html { margin: 0; padding: 0; background-color: var(--bg); font-family: 'Segoe UI', sans-serif; color: white; scroll-behavior: smooth; overflow-x: hidden; user-select: none; }

        /* الهيدر */
        .navbar { position: fixed; top: 0; width: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px); padding: 20px 8%; display: flex; justify-content: space-between; align-items: center; z-index: 2000; border-bottom: 1px solid rgba(0, 210, 255, 0.2); box-sizing: border-box; }
        .nav-logo { font-size: 1.8rem; font-weight: 900; color: var(--primary); text-decoration: none; text-shadow: 0 0 15px var(--primary); }
        .nav-links a { color: white; text-decoration: none; margin-left: 25px; font-weight: 500; font-size: 0.9rem; }

        /* Hero Section */
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle at center, #111 0%, #000 100%); position: relative; overflow: hidden; }
        .hero::before { content: ''; position: absolute; width: 200%; height: 200%; background: conic-gradient(from 0deg, transparent, var(--primary), transparent); animation: rotate 10s linear infinite; opacity: 0.05; }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        .hero-content { position: relative; z-index: 10; text-align: center; }
        .hero-title { font-size: clamp(3rem, 10vw, 6rem); margin-bottom: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 5px; }

        /* الأزرار والبطاقات */
        .main-btn { padding: 15px 35px; border-radius: 50px; text-decoration: none; font-weight: bold; transition: 0.3s; border: 2px solid var(--primary); color: white; background: transparent; display: inline-block; margin-top: 20px; }
        .main-btn:hover { background: var(--primary); color: black; box-shadow: 0 0 30px var(--primary); }
        .features { padding: 100px 8%; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .feat-card { background: rgba(255, 255, 255, 0.03); padding: 40px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; }

        .apply-section { padding: 100px 8%; background: #080808; text-align: center; }
        .special-btn { border-color: var(--secondary); margin: 10px; }
        .special-btn:hover { background: var(--secondary); box-shadow: 0 0 30px var(--secondary); }
    </style>
</head>
<body oncontextmenu="return false;" onkeydown="return false;">

    <nav class="navbar">
        <a href="#" class="nav-logo">VORTEX</a>
        <div class="nav-links">
            <a href="#about">عن المجتمع</a>
            <a href="#apply">التقديمات</a>
            <a href="https://discord.gg/ydptj63w4Q" target="_blank">انضم لنا</a>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h1 class="hero-title">VORTEX</h1>
            <p style="color:#aaa;">أكثر من مجرد سيرفر.. نحن عائلة</p>
            <a href="#apply" class="main-btn">ابدأ رحلتك معنا</a>
        </div>
    </section>

    <section id="about" class="features">
        <div class="feat-card"><h3>🎮 فعاليات يومية</h3><p>بطولات وجوائز مستمرة.</p></div>
        <div class="feat-card"><h3>🛡️ بيئة آمنة</h3><p>حماية وإشراف على مدار الساعة.</p></div>
        <div class="feat-card"><h3>🤝 مجتمع متفاعل</h3><p>تعاون واحترام دائم.</p></div>
    </section>

    <section id="apply" class="apply-section">
        <h2>انضم لفريق الإدارة</h2>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSfcn7F5WYw_lUJzmpqXwV-Q1BbPvX6fccFW8sb7QS9WwSU1sQ/viewform" target="_blank" class="main-btn special-btn">إدارة عليا ⭐</a>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLScHlhU2t0GitwGiVvfR6Vh39C7Jev1vitUb9UESe3jchbvIqw/viewform" target="_blank" class="main-btn special-btn">إدارة عادية 🛡️</a>
    </section>

    <script>
        // حركات الظهور
        ScrollReveal().reveal('.feat-card', { delay: 200, distance: '50px', origin: 'bottom', interval: 100 });

        // --- نظام الحماية المتقدم (تعطيل الأدوات) ---
        (function() {
            // تعطيل الزر الأيمن والاختصارات
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.onkeydown = function(e) {
                if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && e.keyCode == 85)) {
                    return false;
                }
            };

            // اكتشاف فتح أدوات المطورين عن طريق فحص فرق العرض
            setInterval(function() {
                if (window.outerWidth - window.innerWidth > 160 || window.outerHeight - window.innerHeight > 160) {
                    document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20%;'>خطأ في النظام: تم اكتشاف محاولة اختراق</h1>";
                }
            }, 500);
        })();
    </script>
</body>
</html>
