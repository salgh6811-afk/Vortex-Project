<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Community | الواجهة الرسمية</title>
    <style>
        /* إعدادات تضمن عدم ظهور شاشة سوداء فارغة */
        body {
            margin: 0; padding: 0; 
            background-color: #000000; /* خلفية سوداء سادة لضمان التحميل */
            color: white; font-family: sans-serif;
            text-align: center;
        }

        /* الهيدر العلوي */
        .navbar {
            background: #0a0a0a; padding: 20px;
            border-bottom: 2px solid #00d2ff;
            display: flex; justify-content: center; align-items: center;
        }
        .nav-logo { color: #00d2ff; font-size: 1.5rem; font-weight: bold; text-decoration: none; }

        /* القسم الرئيسي */
        .hero {
            padding: 100px 20px;
            background: linear-gradient(to bottom, #000000, #111111);
        }
        .vortex-title {
            font-size: 5rem; margin: 0;
            color: white; text-shadow: 0 0 20px #00d2ff;
        }

        /* الزر المطلوب في المنتصف - تم التأكد من ظهوره */
        .center-btn {
            display: inline-block; margin-top: 30px;
            padding: 15px 40px; border: 2px solid #00d2ff;
            color: white; text-decoration: none; border-radius: 50px;
            font-weight: bold; background: rgba(0, 210, 255, 0.1);
        }
        .center-btn:hover { background: #00d2ff; color: black; }

        /* البطاقات الثلاث */
        .features {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 20px; padding: 50px 10%;
        }
        .card {
            background: #111; border: 1px solid #222;
            padding: 30px; border-radius: 15px; width: 280px;
        }
        .card h3 { color: #00d2ff; margin-bottom: 10px; }

        /* التقديمات */
        .apply { padding: 50px; }
        .apply-btn {
            display: inline-block; margin: 10px;
            padding: 10px 25px; border: 2px solid #ff00ff;
            color: white; text-decoration: none; border-radius: 50px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="nav-logo">VORTEX</a>
    </nav>

    <section class="hero">
        <h1 class="vortex-title">VORTEX</h1>
        <p style="color: #888;">المجتمع الأقوى</p>
        <a href="#about" class="center-btn">ابدأ رحلتك معنا</a>
    </section>

    <section id="about" class="features">
        <div class="card">
            <h3>🤝 مجتمع متفاعل</h3>
            <p>مكان يجمع المبدعين واللاعبين في أجواء يسودها الاحترام.</p>
        </div>
        <div class="card">
            <h3>🛡️ بيئة آمنة</h3>
            <p>نظام حماية متطور لضمان أفضل تجربة للمستخدمين.</p>
        </div>
        <div class="card">
            <h3>🎮 فعاليات يومية</h3>
            <p>تحديات وجوائز مستمرة لكل الأعضاء في السيرفر.</p>
        </div>
    </section>

    <section class="apply">
        <h2>انضم للإدارة</h2>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSfcn7F5WYw_lUJzmpqXwV-Q1BbPvX6fccFW8sb7QS9WwSU1sQ/viewform?usp=dialog" target="_blank" class="apply-btn">إدارة عليا ⭐</a>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLScHlhU2t0GitwGiVvfR6Vh39C7Jev1vitUb9UESe3jchbvIqw/viewform?usp=dialog" target="_blank" class="apply-btn">إدارة عادية 🛡️</a>
    </section>

</body>
</html>
