<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Community | الموقع الرسمي</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow-x: hidden;
        }

        /* --- تنسيق الشريط العلوي (Navbar) --- */
        .navbar {
            position: fixed;
            top: 0; width: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #00d2ff;
            z-index: 2000;
            box-sizing: border-box;
        }

        .nav-logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00d2ff;
            text-decoration: none;
            text-shadow: 0 0 10px #00d2ff;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #ff00ff;
        }

        /* --- الحاوية الرئيسية --- */
        .vortex-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-top: 60px; /* عشان ما يغطي النوافذ */
        }

        .vortex-title {
            font-size: clamp(2.5rem, 8vw, 5rem);
            margin-bottom: 30px;
            font-weight: bold;
            text-shadow: 0 0 20px #00d2ff;
        }

        .btn-group { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            max-width: 600px;
            width: 90%;
        }

        .main-btn {
            padding: 12px 25px;
            border: 2px solid #00d2ff;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            background: rgba(0, 210, 255, 0.05);
            transition: 0.3s;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-btn:hover {
            background: #00d2ff;
            color: black;
            box-shadow: 0 0 20px #00d2ff;
            transform: translateY(-3px);
        }

        .apply-btn { border-color: #ff00ff; background: rgba(255, 0, 255, 0.05); }
        .apply-btn:hover { background: #ff00ff; box-shadow: 0 0 20px #ff00ff; }

        /* --- النوافذ المنبثقة --- */
        .modal {
            display: none; position: fixed; z-index: 3000;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(15px);
        }

        .modal-content {
            background: #111; margin: 10% auto; padding: 25px;
            border: 1px solid #00d2ff; width: 85%; max-width: 600px;
            border-radius: 20px; text-align: right;
        }

        .close-btn { color: #ff00ff; float: left; font-size: 30px; cursor: pointer; }
        .rule-item { margin-bottom: 12px; border-right: 3px solid #00d2ff; padding-right: 15px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="nav-logo">VORTEX</a>
        <div class="nav-links">
            <a href="https://discord.gg/ydptj63w4Q" target="_blank">الديسكورد</a>
            <a href="#" onclick="showRules()">القوانين</a>
            <a href="https://discord.com/channels/1461481866631712932/1461481869513326687" target="_blank">الدعم</a>
        </div>
    </nav>

    <div class="vortex-container">
        <h1 class="vortex-title">Vortex Community</h1>
        
        <div class="btn-group">
            <a href="https://discord.gg/ydptj63w4Q" target="_blank" class="main-btn" style="grid-column: span 2;">دخول السيرفر 🚀</a>
            
            <button class="main-btn" onclick="showRules()">القوانين ⚖️</button>
            <a href="https://discord.com/channels/1461481866631712932/1461481869513326687" target="_blank" class="main-btn">الدعم الفني 🛠️</a>
            
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSfcn7F5WYw_lUJzmpqXwV-Q1BbPvX6fccFW8sb7QS9WwSU1sQ/viewform?usp=dialog" target="_blank" class="main-btn apply-btn">تقديم إدارة عليا ⭐</a>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLScHlhU2t0GitwGiVvfR6Vh39C7Jev1vitUb9UESe3jchbvIqw/viewform?usp=dialog" target="_blank" class="main-btn apply-btn">تقديم إدارة عادية 🛡️</a>
        </div>
    </div>

    <div id="rulesModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="hideRules()">&times;</span>
            <h2 style="text-align: center; color: #ff00ff;">📜 قوانين Vortex</h2>
            <div class="rule-item">1. الاحترام المتبادل بين الجميع.</div>
            <div class="rule-item">2. يمنع السبام والإزعاج.</div>
            <div class="rule-item">3. الالتزام بالمحتوى اللائق.</div>
            <div class="rule-item">4. يمنع نشر الروابط الخارجية دون إذن.</div>
            <div class="rule-item">5. قرارات الإدارة نهائية.</div>
        </div>
    </div>

    <script>
        function showRules() { document.getElementById('rulesModal').style.display = 'block'; }
        function hideRules() { document.getElementById('rulesModal').style.display = 'none'; }
        window.onclick = function(event) { if (event.target.className === 'modal') hideRules(); }
    </script>
</body>
</html>
