<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Community | المجتمع الأقوى</title>
    <script src="https://unpkg.com/scrollreveal"></script>
    <style>
        :root { --primary: #00d2ff; --secondary: #ff00ff; --bg: #050505; }
        body, html { margin: 0; padding: 0; background-color: var(--bg); font-family: 'Segoe UI', sans-serif; color: white; scroll-behavior: smooth; overflow-x: hidden; user-select: none; }
        
        /* تأثير الدوران وVORTEX العملاق */
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; background: #000; }
        .hero::before { 
            content: ''; position: absolute; width: 150vmax; height: 150vmax; 
            background: conic-gradient(from 0deg, transparent, var(--primary), transparent, var(--secondary), transparent); 
            animation: rotateBg 8s linear infinite; opacity: 0.15; filter: blur(60px);
        }
        @keyframes rotateBg { 100% { transform: rotate(360deg); } }
        .hero-title { font-size: clamp(4rem, 15vw, 9rem); font-weight: 900; z-index: 10; text-shadow: 0 0 30px var(--primary); margin: 0; }

        /* الأزرار والمربعات */
        .main-btn { padding: 18px 45px; border-radius: 50px; text-decoration: none; font-weight: bold; transition: 0.4s; cursor: pointer; border: 2px solid var(--primary); color: white; background: transparent; z-index: 10; display: inline-block; }
        .main-btn:hover { background: var(--primary); color: black; box-shadow: 0 0 40px var(--primary); transform: scale(1.05); }
        .apply-section { padding: 100px 8%; text-align: center; background: #080808; z-index: 10; position: relative; }

        /* النافذة */
        .modal { display: none; position: fixed; z-index: 5000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .modal-content { background: #0a0a0a; padding: 35px; border-radius: 25px; border: 2px solid var(--primary); width: 95%; max-width: 500px; position: relative; }
        input, textarea { width: 100%; padding: 14px; margin: 12px 0; background: #151515; border: 1px solid #333; border-radius: 10px; color: white; box-sizing: border-box; }
        .submit-btn { width: 100%; padding: 16px; background: var(--primary); color: black; border: none; border-radius: 10px; font-weight: 900; cursor: pointer; }
    </style>
</head>
<body>

    <section class="hero">
        <h1 class="hero-title">VORTEX</h1>
        <p style="z-index:10; font-size:1.4rem; color:#aaa;">أكثر من مجرد سيرفر.. نحن عائلة</p>
        <a href="#apply" class="main-btn">ابدأ رحلتك معنا</a>
    </section>

    <section id="apply" class="apply-section">
        <h2 style="font-size: 3rem; margin-bottom: 30px;">انضم لفريق الإدارة</h2>
        <button onclick="showModal('إدارة عليا ⭐')" class="main-btn" style="border-color:var(--secondary); margin-bottom:10px;">تقديم إدارة عليا ⭐</button>
        <button onclick="showModal('إدارة صغرى 🛡️')" class="main-btn">تقديم إدارة صغرى 🛡️</button>
    </section>

    <div id="applyModal" class="modal">
        <div class="modal-content">
            <span onclick="closeModal()" style="position:absolute; top:15px; left:20px; cursor:pointer; color:var(--primary); font-size:35px;">&times;</span>
            <h2 id="modalTitle" style="text-align:center; color:var(--primary);">تقديم</h2>
            <form id="webhookForm">
                <input type="hidden" id="rankType">
                <input type="text" id="name" placeholder="اسمك الكامل" required>
                <input type="text" id="discord" placeholder="يوزرك في الديسكورد" required>
                <input type="number" id="age" placeholder="العمر" required>
                <textarea id="exp" rows="4" placeholder="خبراتك السابقة..." required></textarea>
                <button type="submit" id="sendBtn" class="submit-btn">إرسال الطلب ✅</button>
            </form>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1464910592090439681/uwfftinYjhYfh8Tq1kVwpw8Y0yZLHbus0dn3pBwHjvheD3NK0KqLJnBqSatD35pk5fTb";

        function showModal(rank) { document.getElementById('applyModal').style.display = 'flex'; document.getElementById('modalTitle').innerText = "تقديم: " + rank; document.getElementById('rankType').value = rank; }
        function closeModal() { document.getElementById('applyModal').style.display = 'none'; }

        document.getElementById('webhookForm').onsubmit = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('sendBtn');
            btn.innerText = "جاري الإرسال...";
            
            const data = {
                username: "VORTEX BOT 🛡️",
                avatar_url: "https://i.postimg.cc/mD4m3vX4/V-Logo.png",
                embeds: [{
                    title: "🚀 طلب تقديم جديد | VORTEX",
                    color: 0x00d2ff,
                    fields: [
                        { name: "📋 الرتبة", value: document.getElementById('rankType').value },
                        { name: "👤 المتقدم", value: document.getElementById('name').value },
                        { name: "🎮 الديسكورد", value: document.getElementById('discord').value },
                        { name: "📑 الخبرات", value: document.getElementById('exp').value }
                    ]
                }]
            };

            // حل "وت شذا": إرسال الطلب كـ Form عادي يتخطى الـ CORS
            const params = new URLSearchParams();
            params.append('payload_json', JSON.stringify(data));

            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors', // تخطي قيود المتصفح
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params
                });
                alert("تم إرسال الطلب بنجاح! شيك الديسكورد");
                closeModal();
            } catch (err) {
                alert("فشل الإرسال، حاول من متصفح آخر.");
            }
            btn.innerText = "إرسال الطلب ✅";
        };
    </script>
</body>
</html>
